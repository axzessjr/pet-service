server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Reviews may carry up to 4 photos (nginx allows 1 MB by default).
        client_max_body_size 12m;
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
