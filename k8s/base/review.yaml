apiVersion: v1
kind: Service
metadata:
  name: review
spec:
  # Registration: every Ready pod labelled app=review becomes an endpoint of this Service.
  selector:
    app: review
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review
  template:
    metadata:
      labels:
        app: review   # matches the Service selector above
    spec:
      containers:
        - name: review
          image: petbuddy/review
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: petbuddy-secrets
                  key: MONGODB_URL
            - name: MONGODB_DB
              valueFrom:
                configMapKeyRef:
                  name: petbuddy-config
                  key: MONGODB_DB
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: petbuddy-secrets
                  key: RABBITMQ_URL
          # /health pings MongoDB, so a pod that lost its database leaves the EndpointSlice.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          # Keep serving for 5s after deletion starts, so the EndpointSlice drops this pod
          # before the process stops and no in-flight request is cut off.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
