# Service discovery: every address is a Kubernetes Service name, resolved by CoreDNS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pawpal-config
data:
  REVIEW_URL: http://review:3001
  RECOMMENDATION_GRPC_URL: recommender:50051
  RECOMMENDATION_DB_PATH: /data/recommendations.sqlite3
  MONGODB_DB: reviews
