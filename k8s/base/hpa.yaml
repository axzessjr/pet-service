# Scalability (NFR 3): the gateway is stateless, so it scales out on CPU.
# Utilization is measured against the container's CPU request (100m).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # Scale in after 60s of low load instead of the default 300s.
    scaleDown:
      stabilizationWindowSeconds: 60
