apiVersion: v1
kind: Service
metadata:
  name: recommender
spec:
  selector:
    app: recommender
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
---
# Stateless: the rating cache lives in Supabase PostgreSQL (DATABASE_URL).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommender
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommender
  template:
    metadata:
      labels:
        app: recommender
    spec:
      containers:
        - name: recommender
          image: petbuddy/recommender
          ports:
            - name: grpc
              containerPort: 50051
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: petbuddy-secrets
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: petbuddy-secrets
                  key: RABBITMQ_URL
          readinessProbe:
            exec:
              command: ["python", "healthcheck.py"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["python", "healthcheck.py"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
