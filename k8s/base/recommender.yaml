apiVersion: v1
kind: Service
metadata:
  name: recommender
spec:
  selector:
    app: recommender
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: recommender-headless
spec:
  clusterIP: None
  selector:
    app: recommender
  ports:
    - name: grpc
      port: 50051
---
# One replica: saved lists and ratings live in SQLite on a ReadWriteOnce volume.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: recommender
spec:
  serviceName: recommender-headless
  replicas: 1
  selector:
    matchLabels:
      app: recommender
  template:
    metadata:
      labels:
        app: recommender
    spec:
      containers:
        - name: recommender
          image: pawpal/recommender
          ports:
            - name: grpc
              containerPort: 50051
          env:
            - name: RECOMMENDATION_DB_PATH
              valueFrom:
                configMapKeyRef:
                  name: pawpal-config
                  key: RECOMMENDATION_DB_PATH
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: pawpal-secrets
                  key: RABBITMQ_URL
          readinessProbe:
            exec:
              command: ["python", "healthcheck.py"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["python", "healthcheck.py"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
