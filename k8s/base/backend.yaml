# The API gateway. The Service must be named "backend": frontend/nginx.conf proxies /api to backend:3000.
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: petbuddy/backend
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: petbuddy-secrets
                  key: DATABASE_URL
            - name: REVIEW_URL
              valueFrom:
                configMapKeyRef:
                  name: petbuddy-config
                  key: REVIEW_URL
            - name: RECOMMENDATION_GRPC_URL
              valueFrom:
                configMapKeyRef:
                  name: petbuddy-config
                  key: RECOMMENDATION_GRPC_URL
          # The app has no /health yet; /catalog is what docker compose checks too.
          readinessProbe:
            httpGet:
              path: /catalog
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          # Keep serving for 5s after deletion starts, so the EndpointSlice drops this pod first.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
