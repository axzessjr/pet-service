# Docker Desktop Kubernetes (kubeadm mode): images are built locally and tagged :dev.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: petbuddy
resources:
  - ../../base
images:
  - name: petbuddy/backend
    newTag: dev
  - name: petbuddy/review
    newTag: dev
  - name: petbuddy/recommender
    newTag: dev
  - name: petbuddy/frontend
    newTag: dev
# Two review pods, so deleting one in the demo causes no downtime.
# Two recommender pods: the map keeps working while one restarts. Each backend
# pod holds one gRPC connection, so a pod's calls go to one recommender at a time.
replicas:
  - name: review
    count: 2
  - name: recommender
    count: 2
secretGenerator:
  - name: petbuddy-secrets
    envs:
      - secrets.env
    options:
      disableNameSuffixHash: true
# Docker Desktop publishes LoadBalancer services on localhost.
patches:
  - target:
      kind: Service
      name: frontend
    patch: |-
      - op: add
        path: /spec/type
        value: LoadBalancer
      - op: replace
        path: /spec/ports/0/port
        value: 8080
