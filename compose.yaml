services:
  recommender:
    build:
      context: .
      dockerfile: recommender/Dockerfile
    expose:
      - "50051"
    environment:
      RECOMMENDATION_DB_PATH: /data/recommendations.sqlite3
    volumes:
      - recommendation_data:/data
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      RECOMMENDATION_GRPC_URL: recommender:50051
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      recommender:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/catalog').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  recommendation_data:
