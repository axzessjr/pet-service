services:
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    # RabbitMQ stores data per node name, which comes from the hostname.
    hostname: rabbitmq
    environment:
      # The built-in guest user only works from localhost, so services use this one.
      RABBITMQ_DEFAULT_USER: pawpal
      RABBITMQ_DEFAULT_PASS: pawpal
    ports:
      - "15672:15672" # management UI: http://localhost:15672
    expose:
      - "5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  recommender:
    build:
      context: .
      dockerfile: recommender/Dockerfile
    expose:
      - "50051"
    environment:
      RECOMMENDATION_DB_PATH: /data/recommendations.sqlite3
      RABBITMQ_URL: amqp://pawpal:pawpal@rabbitmq:5672
    volumes:
      - recommendation_data:/data
    # No dependency on RabbitMQ: the consumer reconnects on its own, and
    # recommendations keep working (with the last known ratings) while it is down.
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  # Optional local MongoDB for working offline. Reviews normally use MongoDB
  # Atlas (MONGODB_URL in review/.env). Start it with
  # `docker compose --profile local-db up` and point MONGODB_URL at it.
  review-db:
    image: mongo:8.0
    profiles: ["local-db"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: review
      MONGO_INITDB_ROOT_PASSWORD: review
    volumes:
      - review_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  review:
    build:
      context: .
      dockerfile: review/Dockerfile
    expose:
      - "3001"
    # MONGODB_URL (MongoDB Atlas connection string) and MONGODB_DB.
    env_file:
      - review/.env
    environment:
      RABBITMQ_URL: amqp://pawpal:pawpal@rabbitmq:5672
    # RabbitMQ is not required to start: events stay pending until it is up.
    # review-db only runs with the local-db profile.
    depends_on:
      review-db:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      RECOMMENDATION_GRPC_URL: recommender:50051
      REVIEW_URL: http://review:3001
    ports:
      - "3000:3000"
    depends_on:
      recommender:
        condition: service_healthy
      review:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/catalog').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  recommendation_data:
  review_data:
  rabbitmq_data:
