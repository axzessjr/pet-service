services:
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    # RabbitMQ stores data per node name, which comes from the hostname.
    hostname: rabbitmq
    environment:
      # The built-in guest user only works from localhost, so services use this one.
      RABBITMQ_DEFAULT_USER: pawpal
      RABBITMQ_DEFAULT_PASS: pawpal
    ports:
      - "127.0.0.1:15672:15672" # management UI: http://localhost:15672
      - "127.0.0.1:5672:5672" # native local services
    expose:
      - "5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  recommender:
    build:
      context: .
      dockerfile: recommender/Dockerfile
    expose:
      - "50051"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the root .env}
      RABBITMQ_URL: amqp://pawpal:pawpal@rabbitmq:5672
    # No dependency on RabbitMQ: the consumer reconnects on its own, and
    # recommendations keep working (with the last known ratings) while it is down.
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  # Migration source only. Normal operation uses Atlas from the root .env.
  # Keep the old volume until its reviews and GridFS photos are migrated.
  review-db:
    image: mongo:8.0
    profiles: ["migration"]
    ports:
      - "127.0.0.1:27018:27017" # migration tools on this computer only
    environment:
      MONGO_INITDB_ROOT_USERNAME: review
      MONGO_INITDB_ROOT_PASSWORD: review
    volumes:
      - review_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  review:
    build:
      context: .
      dockerfile: review/Dockerfile
    expose:
      - "3001"
    volumes:
      # Atlas X.509 client credential. Never copied into the image.
      - type: bind
        source: ./atlas-client.pem
        target: /run/secrets/atlas-client.pem
        read_only: true
        bind:
          create_host_path: false
    environment:
      MONGODB_URL: ${MONGODB_URL:?Set MONGODB_URL in the root .env}
      MONGODB_DB: ${MONGODB_DB:-reviews}
      MONGODB_TLS_CERTIFICATE_KEY_FILE: /run/secrets/atlas-client.pem
      RABBITMQ_URL: amqp://pawpal:pawpal@rabbitmq:5672
    # RabbitMQ is not required to start: events stay pending in Atlas until it is up.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the root .env}
      RECOMMENDATION_GRPC_URL: recommender:50051
      REVIEW_URL: http://review:3001
    ports:
      - "3000:3000"
    depends_on:
      recommender:
        condition: service_healthy
      review:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/catalog').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  # Retained only to export pre-migration SQLite data; no running service mounts it.
  recommendation_data:
  review_data:
  rabbitmq_data:
